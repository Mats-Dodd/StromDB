[package]
name = "strom-storage-domain"
description = "Pure storage vocabulary and durable codecs for StromDB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
proptest = ["dep:proptest", "strom-domain/proptest"]

[dependencies]
bytes = { workspace = true }
proptest = { workspace = true, optional = true }
rkyv = { workspace = true }
strom-domain = { path = "../strom-domain", version = "0.1.0" }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
strom-domain = { path = "../strom-domain", version = "0.1.0", features = ["proptest"] }
