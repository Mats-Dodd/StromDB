[package]
name = "strom-common"
description = "Deterministic capability seams (clock and entropy) shared by StromDB crates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rand = { workspace = true }
# ChaCha directly, not rand::rngs::StdRng: StdRng is documented as non-portable,
# so a rand upgrade may silently change every stream a seed reproduces.
rand_chacha = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
