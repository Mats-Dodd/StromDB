[package]
name = "strom-domain"
description = "Pure Durable Streams protocol domain types for cold, per-stream Ledger metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Proptest strategies for every domain type, so downstream crates generate
# valid values without a copy of the parsing rules.
proptest = ["dep:proptest"]

[dependencies]
jiff = { workspace = true }
proptest = { workspace = true, optional = true }
# Serialize only. These impls fix each type's durable spelling; Deserialize
# is deliberately absent so untrusted bytes must re-enter through the
# canonical parsers (`FromStr` / `TryFrom`).
serde = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
