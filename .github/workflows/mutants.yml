name: Mutants

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure devenv binary cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Run the mutation gate
        run: devenv shell just mutants-ci

      - name: Upload mutant outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutants.out/**
          if-no-files-found: ignore
          retention-days: 14
