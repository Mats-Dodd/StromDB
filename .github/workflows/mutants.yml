name: Mutants

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install workspace tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,nextest,cargo-mutants@27.1.0
          fallback: none

      - name: Run the mutation gate
        run: just mutants-ci

      - name: Upload mutant outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutants.out/**
          if-no-files-found: ignore
          retention-days: 14
